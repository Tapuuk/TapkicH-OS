# TapkicH-OS live ISO: the installer's terminal (the font size is set by tapkich-kiosk-term for the screen)
[main]
dpi-aware=no
pad=32x26 center
term=foot

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[colors-dark]
# smoke glass: dark grey, see-through (Hyprland blurs the picture behind it)
alpha=0.62
background=1c1c22
foreground=eeeef1
regular0=24242b
regular1=f08c8c
regular2=93d3a2
regular3=e6c884
regular4=8fb2f2
regular5=c5a3ff
regular6=85d0cf
regular7=c8c8cf
bright0=6e6b78
bright1=ff6b6b
bright2=a8e2b6
bright3=f0d79c
bright4=a9c4f6
bright5=d6bcff
bright6=9fdcdb
bright7=ffffff
selection-background=3a2f52
selection-foreground=ffffff
